function normalizeRest(r){

  return false;
}

// Persistent AudioContext
let _actx=null;
function getAudioCtx(){
  if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==="suspended")_actx.resume().catch(e=>console.warn("Áudio bloqueado",e));
  return _actx;
}
// Rest-timer sounds modelled on Insight Timer's "Basu" bowl (user's recording), softened and shortened:
// wood taps on 3-2-1, bowl at zero. BOWL_R2 is the measured ratio between the bowl's two main partials.
const BOWL_F0=440,BOWL_R2=3325.3/1243.7,SOUND_MASTER=0.085;
const BOWL_PARTS=[[BOWL_F0,0,-8],[BOWL_F0+0.35,-3,-8],[BOWL_F0-7,-9,-9],[BOWL_F0*BOWL_R2,-12,-12],[BOWL_F0*BOWL_R2+6.7,-18,-12]];// Hz, dB, dB/s
function partial(ctx,dest,t,f,peak,attack,decDb,hold,fade){
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(dest);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+attack);
  g.gain.exponentialRampToValueAtTime(Math.max(peak*Math.pow(10,decDb*hold/20),1e-4),t+attack+hold);
  g.gain.exponentialRampToValueAtTime(1e-4,t+attack+hold+fade);o.start(t);o.stop(t+attack+hold+fade+0.05);
}
function playAlarm(){
  try{const ctx=getAudioCtx();const m=ctx.createGain();m.gain.value=SOUND_MASTER;m.connect(ctx.destination);const t=ctx.currentTime+0.02;
    BOWL_PARTS.forEach(([f,db,dec])=>partial(ctx,m,t,f,Math.pow(10,db/20),0.035,dec,2.4,0.6));
  }catch(e){console.warn("Alarme sem som",e)}
}
function playTick(last){
  try{const ctx=getAudioCtx();const m=ctx.createGain();m.gain.value=SOUND_MASTER*0.25;m.connect(ctx.destination);const t=ctx.currentTime+0.01;const f=last?760:620;
    partial(ctx,m,t,f,1,0.003,-60/0.08,0.08,0.02);partial(ctx,m,t,f*2.3,0.25,0.003,-60/0.04,0.04,0.02);
  }catch(e){console.warn("Tique sem som",e)}
}

// Wake Lock — keeps screen on during workout
function useWakeLock(active){
  const ref=useRef(null);
  useEffect(()=>{
    if(!active||!("wakeLock" in navigator))return;
    let released=false;
    const acquire=async()=>{try{const l=await navigator.wakeLock.request("screen");if(released){l.release();return}ref.current=l}catch(e){console.warn("Wake lock indisponível",e)}};
    acquire();
    const h=()=>{if(!document.hidden&&!released)acquire()};
    document.addEventListener("visibilitychange",h);
    return()=>{released=true;try{ref.current?.release()}catch{};document.removeEventListener("visibilitychange",h)};
  },[active]);
}

function RestTimer({seconds,next,onClose}){
  const t=useT();
  const[rem,setRem]=useState(seconds);
  const[run,setRun]=useState(true);
  const[total,setTotal]=useState(seconds);
  const[epoch,setEpoch]=useState(0);// bumps when ±15 s moves the end, so the background timeout is re-armed
  const endTimeRef=useRef(Date.now()+seconds*1000);
  const closedRef=useRef(false);
  const intervalRef=useRef(null);
  const bgTimeoutRef=useRef(null);
  const lastTickRef=useRef(-1);
  const returnRef=useRef(null);

  const fireAlarm=useCallback(()=>{
    if(closedRef.current)return;closedRef.current=true;
    clearInterval(intervalRef.current);clearTimeout(bgTimeoutRef.current);
    try{navigator.vibrate?.([300,150,300,150,400])}catch(e){console.warn("Vibração indisponível",e)}
    if(!document.hidden){playAlarm();setRem(0);onClose()}
    else{
      setRem(0);
      const onReturn=()=>{if(!document.hidden){playAlarm();try{navigator.vibrate?.([300,150,300,150,400])}catch(e){console.warn("Vibração indisponível",e)}document.removeEventListener("visibilitychange",onReturn);returnRef.current=null;onClose()}};
      returnRef.current=onReturn;document.addEventListener("visibilitychange",onReturn);
    }
  },[onClose]);
  // a timer replaced by a new one must not keep a pending "on return" close around
  useEffect(()=>()=>{if(returnRef.current)document.removeEventListener("visibilitychange",returnRef.current)},[]);

  // Background setTimeout — fires alarm even when tab is hidden
  useEffect(()=>{
    if(!run){clearInterval(intervalRef.current);clearTimeout(bgTimeoutRef.current);return}
    const tick=()=>{
      const r=Math.max(0,Math.ceil((endTimeRef.current-Date.now())/1000));
      setRem(r);
      if(r>0&&r<=3&&r!==lastTickRef.current){lastTickRef.current=r;playTick(r===1);try{navigator.vibrate?.(15)}catch(e){console.warn("Vibração indisponível",e)}}
      if(r<=0)fireAlarm();
    };
    intervalRef.current=setInterval(tick,250);
    clearTimeout(bgTimeoutRef.current);
    const ms=endTimeRef.current-Date.now();
    if(ms>0)bgTimeoutRef.current=setTimeout(fireAlarm,ms);
    return()=>{clearInterval(intervalRef.current);clearTimeout(bgTimeoutRef.current)};
  },[run,fireAlarm,epoch]);

  const togglePause=()=>{if(run)setRun(false);else{endTimeRef.current=Date.now()+rem*1000;setRun(true)}};
  const shift=d=>{
    const r=Math.max(1,rem+d);
    if(run){endTimeRef.current=Date.now()+r*1000;setEpoch(e=>e+1)}
    lastTickRef.current=-1;setRem(r);setTotal(x=>Math.max(x+d,r));
  };

  // Recalculate on visibility change (returning from background)
  useEffect(()=>{
    const h=()=>{if(!document.hidden&&run){
      const r=Math.max(0,Math.ceil((endTimeRef.current-Date.now())/1000));
      setRem(r);if(r<=0&&!closedRef.current)fireAlarm();
    }};
    document.addEventListener("visibilitychange",h);
    return()=>document.removeEventListener("visibilitychange",h);
  },[run,fireAlarm]);

  if(rem<=0)return null;// the alarm closes it right away
  const R=104,C=2*Math.PI*R,pct=Math.min((total-rem)/total,1);
  const b={height:54,borderRadius:18,border:"none",background:"rgba(255,255,255,.09)",color:"#e2e8f0",fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8};
  return(
    <div style={{position:"fixed",inset:0,background:t.overlay,zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div style={{width:"100%",maxWidth:480,background:`linear-gradient(170deg,${t.heroA},${t.heroB})`,borderRadius:"30px 30px 0 0",padding:"14px 24px",paddingBottom:"max(24px, env(safe-area-inset-bottom))",color:"#fff"}}>
        <div style={{width:40,height:5,borderRadius:3,background:"rgba(255,255,255,.25)",margin:"0 auto 16px"}}/>
        <div style={{textAlign:"center",fontSize:12,fontWeight:700,letterSpacing:1.5,color:"#94a3b8"}}>DESCANSO</div>
        <div style={{position:"relative",width:232,height:232,margin:"12px auto 16px"}}>
          <svg width="232" height="232" style={{transform:"rotate(-90deg)"}}>
            <circle cx="116" cy="116" r={R} fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="12"/>
            <circle cx="116" cy="116" r={R} fill="none" stroke="#3b82f6" strokeWidth="12" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C*pct} style={{transition:"stroke-dashoffset .3s"}}/>
          </svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div style={{fontSize:58,fontWeight:800,letterSpacing:-1,fontVariantNumeric:"tabular-nums",lineHeight:1}}>{fmtClock(rem)}</div>
            <div style={{fontSize:13,color:"#94a3b8",marginTop:6}}>{run?`De ${fmtClock(total)}`:"Pausado"}</div>
          </div>
        </div>
        {next&&<div style={{background:"rgba(255,255,255,.07)",borderRadius:18,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,gap:10}}>
          <div style={{minWidth:0}}><div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:2}}>PRÓXIMA</div><div style={{fontSize:15,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{next.name} · série {next.set} de {next.of}</div></div>

        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:6}}>
          <button onClick={()=>shift(-15)} style={b}>−15 s</button>

          <button onClick={()=>shift(15)} style={b}>+15 s</button>
        </div>
        <button onClick={onClose} style={{width:"100%",height:48,border:"none",background:"none",color:"#94a3b8",fontSize:14,fontWeight:600}}>Pular descanso</button>

    </div>
  );
}

  const addSet=()=>{if(curSets.length>=MAX_SETS)return;const ns=[...curSets,false];

  const removeSet=()=>{if(curSets.length<=1)return;const ns=curSets.slice(0,-1);
    if(tag==="dropset"){const dw=[...(data.dropWeights||[])];dw.pop();onUpdate({...data,sets:ns,dropWeights:dw})}

  const setTag=(newTag)=>{
    if(newTag==="dropset"){const dw=curSets.map((_,i)=>i===0?data.weight:null);onUpdate({...data,tag:newTag,dropWeights:dw})}

  };
  const ssGroup=data.ssGroup||SS_GROUPS[0];
  const toggleSkip=()=>{onUpdate({...data,skipped:!skipped})};
  const handleSetClick=(i)=>{
    const n=[...curSets];n[i]=!n[i];onUpdate({...data,sets:n});
    try{navigator.vibrate?.(10)}catch(e){console.warn("Vibração indisponível",e)}
    if(!n[i])return;// unchecking
    if(n.every(Boolean))return;// exercise complete — no rest needed
    onRest(normalizeRest(ex.rest));
  };
  const hasLoad=!!(ex.rule||WEIGHTS[ex.type]?.length);
  const nextIdx=curSets.findIndex(x=>!x);
  const delta=last&&last.weight!=null&&data.weight!=null?Math.round((data.weight-last.weight)*10)/10:0;
  const small={width:30,height:30,borderRadius:10,border:"none",background:t.cardAlt,display:"flex",alignItems:"center",justifyContent:"center"};

      <div onClick={()=>{if(!skipped)setOpen(!open)}} style={{display:"flex",alignItems:"center",gap:12,cursor:skipped?"default":"pointer"}}>

          {all?<I d={IC.check} s={16} c="#fff" sw={2.8}/>:skipped?<I d={IC.skip} s={13} c={t.textSec}/>:idx+1}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:15,fontWeight:700,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ex.name}</span>{!skipped&&!open&&<ProgBadge dir={prog}/>}</div>
          <div style={{fontSize:12,color:t.textSec,marginTop:1}}>{skipped?"Pulado":`${curSets.length} × ${ex.reps} · ${fmtRest(ex.rest)}${tag==="dropset"?" · drop set":""}`}</div>
        </div>
        {skipped?<button onClick={e=>{e.stopPropagation();toggleSkip()}} style={{background:t.accentBg,border:"none",borderRadius:10,padding:"7px 12px",fontSize:12,fontWeight:700,color:t.accent}}>Desfazer</button>
        :<div style={{textAlign:"right",flexShrink:0}}>
          {hasLoad&&data.weight!=null?<div style={{fontSize:17,fontWeight:800,color:t.text,lineHeight:1}}>{fmtKg(data.weight)}<div style={{fontSize:11,color:t.textTer,fontWeight:600,marginTop:2}}>kg</div></div>:<div style={{fontSize:11,color:t.textTer,fontWeight:600}}>Sem carga</div>}
          {!open&&<div style={{display:"flex",gap:3,justifyContent:"flex-end",marginTop:5}}>{curSets.map((d,i)=><i key={i} style={{width:6,height:6,borderRadius:3,background:d?t.accent:t.border,display:"block"}}/>)}</div>}
        </div>}
      </div>
      {open&&!skipped&&<div style={{marginTop:14}}>
        {last&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:t.cardAlt,borderRadius:14,padding:"10px 12px",marginBottom:12,fontSize:12,color:t.textSec,gap:8}}>
          <span>Última vez · {last.date}</span>
          <span style={{display:"flex",alignItems:"center",gap:6}}><b style={{color:t.text}}>{last.weight!=null?`${fmtKg(last.weight)} kg`:"Sem carga"}</b>· {last.done}/{last.total} séries
            {delta!==0&&<span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:100,background:delta>0?t.accentBg:t.cardAlt,color:delta>0?t.accent:t.textSec,fontWeight:700}}><I d={delta>0?IC.up:IC.down} s={11} c={delta>0?t.accent:t.textSec} sw={2.6}/>{fmtKg(Math.abs(delta))}</span>}</span>
        </div>}
        {hasLoad&&<WeightStepper value={data.weight} type={ex.type} rule={ex.rule} onChange={w=>onUpdate({...data,weight:w,...(tag==="dropset"&&data.dropWeights?{dropWeights:[w,...data.dropWeights.slice(1)]}:{})})}/>}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontSize:11,color:t.textSec,fontWeight:700,letterSpacing:1}}>SÉRIES</span>

          </div>
        </div>
        {tag==="dropset"?<div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
          {curSets.map((d,i)=>{const dw=data.dropWeights||[];const w=dw[i];

              <button onClick={()=>handleSetClick(i)} style={{width:48,height:48,borderRadius:16,border:d?"none":`1.5px ${i===nextIdx?"dashed":"solid"} ${i===nextIdx?t.accent:t.border}`,background:d?t.accent:t.card,color:d?"#fff":t.text,fontSize:16,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{d?<I d={IC.check} s={18} c="#fff" sw={2.8}/>:i+1}</button>
              {i===0?<span style={{fontSize:15,fontWeight:700,color:t.text}}>{fmtKg(data.weight)} kg</span>
              :<><input type="number" inputMode="decimal" defaultValue={w!=null?w:""} key={`dw${i}_${tag}`} onBlur={e=>{const nw=[...(data.dropWeights||curSets.map(()=>null))];nw[i]=e.target.value===""?null:parseFloat(e.target.value);nw[0]=data.weight;onUpdate({...data,dropWeights:nw})}} style={{width:90,padding:"10px 12px",borderRadius:14,border:`1.5px solid ${t.border}`,background:t.inputBg,color:t.text,textAlign:"center",outline:"none"}} placeholder="kg"/>
                {w!=null&&w<(dw[i-1]??data.weight)&&<span style={{fontSize:11,color:t.textSec,fontWeight:700,display:"inline-flex",alignItems:"center",gap:2}}><I d={IC.down} s={11} c={t.textSec} sw={2.6}/>{Math.round(((dw[i-1]??data.weight)-w)/(dw[i-1]??data.weight)*100)}%</span>}</>}
            </div>})}
        </div>
        :<div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(Math.max(curSets.length,1),4)},1fr)`,gap:8,marginBottom:12}}>
          {curSets.map((d,i)=><button key={i} onClick={()=>handleSetClick(i)} style={{height:64,borderRadius:18,border:d?"none":`1.5px ${i===nextIdx?"dashed":"solid"} ${i===nextIdx?t.accent:t.border}`,background:d?t.accent:t.card,color:d?"#cfe0ff":t.textSec,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,fontSize:12,fontWeight:600}}>
            {d?<I d={IC.check} s={22} c="#fff" sw={2.6}/>:<b style={{fontSize:18,color:t.text}}>{i+1}</b>}<span>{d?`Série ${i+1}`:ex.reps}</span></button>)}
        </div>}
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <Seg width={tag==="superset"?190:230} value={tag} onChange={setTag} opts={[[null,"Normal"],["superset","Super set"],["dropset","Drop"]]}/>
          {tag==="superset"&&<div style={{display:"flex",gap:4}}>{SS_GROUPS.map(g=><button key={g} aria-label={`Grupo ${g}`} onClick={()=>onUpdate({...data,ssGroup:g})} style={{width:28,height:28,borderRadius:9,border:"none",background:g===ssGroup?t.accent:t.cardAlt,color:g===ssGroup?"#fff":t.textSec,fontSize:12,fontWeight:700,padding:0}}>{g}</button>)}</div>}
          <button onClick={toggleSkip} style={{marginLeft:"auto",background:"none",border:"none",fontSize:13,color:t.textSec,fontWeight:600}}>Pular exercício</button>
        </div>
        <div ref={endRef} style={{height:1,scrollMarginBottom:120}}/>
      </div>}
    </div>
  );
}

  const[reps,setReps]=useState(ex.reps);const[rest,setRest]=useState(ex.rest);

  const restOpts=[...new Set([...Object.values(td).flatMap(w=>(w.exercises||[]).map(e=>normalizeRest(e.rest))),...(rest?[normalizeRest(rest)]:[])])].sort((a,b)=>a-b);

  const stp={display:"flex",alignItems:"center",justifyContent:"space-between",background:t.card,borderRadius:16,padding:6,marginBottom:14,boxShadow:t.shadow};

  return(
    <BottomSheet onClose={onClose}>
      <SheetHead title={isNew?"Novo exercício":"Editar exercício"} onClose={onClose}/>
      <label style={u.lbl}>Nome</label>
      <input value={name} onChange={e=>setName(e.target.value)} style={u.inp} autoComplete="off" placeholder="Ex: Supino reto com barra"/>

        <div><label style={u.lbl}>Repetições</label><input value={reps} onChange={e=>setReps(e.target.value)} style={{...u.inp,padding:"15px 16px"}} autoComplete="off" placeholder="Ex: 8–12"/></div>
      </div>
      <label style={u.lbl}>Descanso</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:restCustom?10:16}}>
        {restOpts.map(v=><button key={v} onClick={()=>{setRest(v);setRestCustom(false)}} style={u.chip(!restCustom&&normalizeRest(rest)===v)}>{fmtRest(v)}</button>)}
        <button onClick={()=>setRestCustom(true)} style={u.chip(restCustom)}>Outro</button>
      </div>
      {restCustom&&<input type="number" autoFocus value={rest||""} onChange={e=>setRest(e.target.value?parseInt(e.target.value):"")} min="10" max="600" step="5" style={u.inp} placeholder="Segundos, ex: 75"/>}
      <label style={u.lbl}>Peso inicial</label>
      <div style={stp}><button aria-label="Menos peso" style={sb} onClick={()=>stepW(-1)}><I d={IC.minus} s={18} c={t.text} sw={2.4}/></button><b style={{fontSize:18,color:t.text}}>{fmtKg(weight)} <span style={{fontSize:12,color:t.textSec,fontWeight:600}}>kg</span></b><button aria-label="Mais peso" style={sb} onClick={()=>stepW(1)}><I d={IC.plus} s={18} c={t.text} sw={2.4}/></button></div>
      <label style={u.lbl}>Equipamento</label>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:18}}>
        {eqTypes.map(tp=><button key={tp} onClick={()=>setType(tp)} style={{...u.chip(tp===type),textTransform:"capitalize"}}>{tp}</button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:isNew?"1fr":"1fr 2fr",gap:10}}>
        {!isNew&&<button onClick={()=>{if(!confirm(`Excluir "${ex.name}"? O histórico dele em todas as sessões também será apagado.`))return;onDelete();onClose()}} style={u.btnD}><I d={IC.trash} s={17} c={t.red}/>Excluir</button>}
        <button onClick={()=>{if(!name.trim())return;onSave({name,sets:Math.min(Math.max(parseInt(sets)||1,1),SETS_MAX),reps:reps||"8–12",rest:Math.max(rest||90,10),initWeight:weight,type,...(ex.rule&&type===ex.type?{rule:ex.rule}:{})});onClose()}} style={u.btnP}>Salvar</button>
      </div>
    </BottomSheet>
  );
}

// Parse pasted text into exercises (used by the import preview and the import itself)
function parseExerciseText(raw){
  const norm=raw.replace(/^([^\t\n]+)\t+(\d{1,2})\t+(\d[^\t\n]*?)(?=\t|$)/gm,"$1 $2x$3").replace(/\t/g,"  ").replace(/[|;]/g," ");
  const lines=norm.split(/\n/).map(l=>l.trim()).filter(l=>l&&!/^[-=#*_]{2,}$/.test(l));
  const exs=[];
  for(const line0 of lines){
    if(!/\d/.test(line0))continue;
    // decimal comma only before a unit (12,5kg · 1,5 min) so rep lists like 4x12,10,8 stay intact
    const line=line0.replace(/^\[[^\]]*\]\s*[^:]{1,40}:\s*/,"").replace(/[*_~]/g,"").replace(/^(?:\d{1,2}(?:[.)]|\s*[-–]\s)|[•●▪◦‣·\-–—]|\p{Extended_Pictographic}\uFE0F?)\s*/u,"")
      .replace(/(\d),(\d+)\s*(kg|min)/gi,"$1.$2$3")
      .replace(/(\d+)\s*s[ée]ries?\s*(?:de|x|×)?\s*(\d+(?:\s*(?:[-–]|a)\s*\d+)?)\s*(?:(?:rep(?:eti[çc][õo]es|s)?)\.?)?(?![\wáéíóúãõç])/i,"$1x$2")
      .replace(/([xX×]\s*\d+)\s+a\s+(\d+)\b/g,"$1-$2")
      .replace(/\b(\d{1,2})(?:\s*[:']\s*|\s*min(?:utos?)?|m)(\d{2})(?![\d.,]|\s*kg)\s*(?:''|"|s|seg)?(?![\wáéíóúãõ])/gi,(_,a,b)=>(+a*60+ +b)+"s")
      .replace(/\b(\d{2,3})\s*(?:''|"|″)/g,"$1s")
      .replace(/(\d)\s*min(?:utos?)\b/gi,"$1min");
    let sets=3,reps="8-12",rest=90,weight=null,type="máquina";
    // 1) sets x reps FIRST (before rest, to avoid "30-45s" being eaten). Text before it is the name area,
    //    text after it is where a bare rest number may sit ("Leg press 45 4x10 90" → 45 is part of the name)
    let head=line,tail="",hasSM=false;
    const sm=line.match(/(\d+)\s*[xX×]\s*([^\sxX×()]+)(?:\s*[xX×]\s*(\d+(?:\.\d+)?)\s*(?:kg)?(?![\w.]))?/);if(sm&&sm[3])weight=parseFloat(sm[3]);
    if(sm){hasSM=true;sets=parseInt(sm[1])||3;reps=sm[2].replace(/[,;]+$/,"").replace(/,/g,"/");head=line.slice(0,sm.index);tail=line.slice(sm.index+sm[0].length)}
    if(hasSM){const ru=tail.match(/^\s*(?:seg(?:undos?)?|s)\b/i);if(ru&&/^\d+(?:-\d+)?$/.test(reps)){reps+="s";tail=tail.slice(ru[0].length)}}
    const take=re=>{let m=tail.match(re);if(m){tail=tail.replace(m[0]," ");return m}m=head.match(re);if(m){head=head.replace(m[0]," ");return m}return null};
    // 2) weight
    const wm=take(/(\d+(?:\.\d+)?)\s*kg\b/i);if(wm)weight=parseFloat(wm[1]);
    // 3) rest with unit
    const rm=take(/\b(\d+)\s*(?:seg(?:undos)?)\b/i);
    const rms=rm?null:take(/\b(\d{2,3})\s*s\b(?![\wáéíóúãõ])/i);
    const rmm=rm||rms?null:take(/(\d+(?:\.\d+)?)\s*min\b/i);
    if(rm)rest=parseInt(rm[1]);else if(rms)rest=parseInt(rms[1]);else if(rmm&&parseFloat(rmm[1])<=5)rest=Math.round(parseFloat(rmm[1])*60);
    // 4) bare number 30-300 as rest: after sets×reps, or the last token when there is none
    else{const re=hasSM?/(?:^|[\s,])\s*(\d{2,3})(?=[\s,]|$)/:/(?:^|[\s,])\s*(\d{2,3})\s*$/;const src=hasSM?tail:head;const bn=src.match(re);
      if(bn){const v=parseInt(bn[1]);if(v>=30&&v<=300){rest=v;if(hasSM)tail=tail.replace(bn[0]," ");else head=head.replace(bn[0]," ")}}}
    let name=(head+" "+tail).replace(/\b(?:descanso|desc\.|intervalo|pausa)(?![\wáéíóúãõç])/gi," ");if(!hasSM&&/^\s*(treino|dia|semana|fase|bloco|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)\b/i.test(name))continue;
    // guess equipment type
    const nl=name.toLowerCase();
    if(/halter|haltere|dumbbell/i.test(nl))type="halter";
    else if(/barra|smith|supino.*barra|terra|rosca.*barra/i.test(nl))type="barra";
    else if(/polia|cabo|corda|cross|face.?pull|pullover.*polia|triceps.*corda/i.test(nl))type="polia";
    else if(/corpo|prancha|flexão|abdominal|plank/i.test(nl))type="corpo";
    else if(/elástico|band|faixa/i.test(nl))type="elástico";
    else if(/anilha/i.test(nl))type="anilha";
    name=name.replace(/\(\s*\)|\[\s*\]/g," ").replace(/\s[·\-–—|,;:.]+(?=\s|$)/g," ").replace(/\s{2,}/g," ").trim().replace(/[\s·\-–—|,;:.(]+$/,"").replace(/^[\s·\-–—|,;:.)]+/,"").replace(/\s{2,}/g," ").trim();
    if(!name||name.length<2)continue;
    name=name.charAt(0).toUpperCase()+name.slice(1);
    exs.push({name,sets,reps,rest,initWeight:weight,type});
  }
  return exs;
}

// ── COLOR PICKER (Canva-style) ───────────────────────────────
function ColorPicker({color,onChange}){
  const t=useT();
  const canvasRef=useRef(null);const hueRef=useRef(null);
  const[hue,setHue]=useState(0);
  const[sat,setSat]=useState(100);
  const[val,setVal]=useState(100);
  const[hex,setHex]=useState(color||"#ff0000");
  const dragging=useRef(null);

  // hex to hsv
  useEffect(()=>{
    const r=parseInt(color.slice(1,3),16)/255,g=parseInt(color.slice(3,5),16)/255,b=parseInt(color.slice(5,7),16)/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
    let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}
    const s=mx?Math.round(d/mx*100):0;const v=Math.round(mx*100);
    setHue(h);setSat(s);setVal(v);setHex(color);
  },[]);

  const hsvToHex=(h,s,v)=>{
    s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}
    const toH=n=>Math.round((n+m)*255).toString(16).padStart(2,"0");
    return`#${toH(r)}${toH(g)}${toH(b)}`;
  };

  const update=(h,s,v)=>{const c=hsvToHex(h,s,v);setHex(c);onChange(c)};

  const handleGradient=(e,isTouch)=>{
    const rect=canvasRef.current.getBoundingClientRect();
    const clientX=isTouch?e.touches[0].clientX:e.clientX;
    const clientY=isTouch?e.touches[0].clientY:e.clientY;
    const x=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    const y=Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
    const s2=Math.round(x*100);const v2=Math.round((1-y)*100);
    setSat(s2);setVal(v2);update(hue,s2,v2);
  };

  const handleHue=(e,isTouch)=>{
    const rect=hueRef.current.getBoundingClientRect();
    const clientX=isTouch?e.touches[0].clientX:e.clientX;
    const x=Math.max(0,Math.min(1,(clientX-rect.left)/rect.width));
    const h2=Math.round(x*360);setHue(h2);update(h2,sat,val);
  };

  const onDown=(type)=>(e)=>{e.preventDefault();dragging.current=type;if(type==="grad")handleGradient(e,e.type==="touchstart");else handleHue(e,e.type==="touchstart")};

  useEffect(()=>{
    const onMove=e=>{if(!dragging.current)return;e.preventDefault();if(dragging.current==="grad")handleGradient(e,e.type==="touchmove");else handleHue(e,e.type==="touchmove")};
    const onUp=()=>{dragging.current=null};
    window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);
    window.addEventListener("touchmove",onMove,{passive:false});window.addEventListener("touchend",onUp);
    return()=>{window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);window.removeEventListener("touchmove",onMove);window.removeEventListener("touchend",onUp)};
  },[hue,sat,val]);

  const hueColor=hsvToHex(hue,100,100);

  return(
    <div>
      <div ref={canvasRef} onMouseDown={onDown("grad")} onTouchStart={onDown("grad")}
        style={{width:"100%",height:160,borderRadius:12,position:"relative",cursor:"crosshair",
          background:`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hueColor})`,touchAction:"none"}}>
        <div style={{position:"absolute",left:`${sat}%`,top:`${100-val}%`,width:18,height:18,borderRadius:"50%",border:"3px solid #fff",boxShadow:"0 1px 4px rgba(0,0,0,.4)",transform:"translate(-50%,-50%)",pointerEvents:"none",background:hex}}/>
      </div>
      <div ref={hueRef} onMouseDown={onDown("hue")} onTouchStart={onDown("hue")}
        style={{width:"100%",height:16,borderRadius:8,marginTop:12,cursor:"pointer",touchAction:"none",
          background:"linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)",position:"relative"}}>
        <div style={{position:"absolute",left:`${hue/360*100}%`,top:"50%",width:20,height:20,borderRadius:"50%",border:"3px solid #fff",boxShadow:"0 1px 4px rgba(0,0,0,.4)",transform:"translate(-50%,-50%)",pointerEvents:"none",background:hueColor}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:12}}>
        <div style={{width:36,height:36,borderRadius:10,background:hex,border:`1px solid ${t.border}`,flexShrink:0}}/>
        <input value={hex} onChange={e=>{const v=e.target.value;setHex(v);if(/^#[0-9a-fA-F]{6}$/.test(v)){onChange(v);const r=parseInt(v.slice(1,3),16)/255,g=parseInt(v.slice(3,5),16)/255,b=parseInt(v.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}setHue(h);setSat(mx?Math.round(d/mx*100):0);setVal(Math.round(mx*100))}}}
          style={{flex:1,padding:"8px 12px",borderRadius:10,border:`1px solid ${t.border}`,background:t.inputBg,color:t.text,fontSize:14,outline:"none",fontFamily:"monospace"}}/>
      </div>
    </div>
  );
}

function PlanModal({state,setState,onClose,section="dates"}){
  const u=useUi(),t=u.t;
  const[total,setTotal]=useState(state.total||"");
  const[startD,setStartD]=useState(state.startDate?ymdLocal(state.startDate):"");
  const[phases,setPhases]=useState(JSON.parse(JSON.stringify(state.phases||[])));
  const[pickIdx,setPickIdx]=useState(null);
  const addPhase=()=>{if(phases.length<8)setPhases([...phases,{name:"Nova fase",color:PALETTE[phases.length%PALETTE.length],weeks:2}])};
  const removePhase=i=>{const c=[...phases];c.splice(i,1);setPhases(c)};
  const updatePhase=(i,field,val)=>{const c=[...phases];c[i]={...c[i],[field]:val};setPhases(c)};
  const totalPhaseWeeks=phases.reduce((a,p)=>a+(p.weeks||1),0);
  const apply=()=>{
    const t2=Math.min(52,Math.max(1,parseInt(total)||16));
    const s=parseYmd(startD);if(!s){alert("Defina a data de início");return}
    const lost=Object.keys(state.w||{}).filter(k=>state.w[k].sessions.slice(t2).some(x=>x.status));
    if(lost.length&&!confirm(`Reduzir para ${t2} semanas apaga sessões já registradas (${lost.join(", ")}). Continuar?`))return;
    const ph2=phases.map(p=>({...p,weeks:parseInt(p.weeks)||1}));
    setState(p=>{
      saveBackup(p);
      const n={...JSON.parse(JSON.stringify(p)),startDate:s.toISOString(),total:t2,phases:ph2};
      if(t2!==p.total){const newW={};Object.keys(n.td).forEach(k=>{const old=n.w[k];newW[k]={cur:Math.min(old?.cur||0,t2-1),sessions:Array.from({length:t2},(_,i)=>{if(old?.sessions[i])return old.sessions[i];return{status:null,exercises:n.td[k].exercises.map(e=>({weight:e.initWeight,sets:Array(e.sets).fill(false)}))}})};});Object.values(newW).forEach(w=>{const f=w.sessions.findIndex(x=>!x.status);if(f>w.cur){const pv=w.sessions[f-1];w.sessions[f].exercises.forEach((e,q)=>{const b=pv.deload&&pv._origWeights?.[q]!=null?pv._origWeights[q]:pv.exercises[q]?.weight;if(b!=null)e.weight=b});w.cur=f}});n.w=newW;}
      return n;
    });onClose();
  };
  const end=(()=>{const e=parseYmd(startD);if(!e)return null;e.setDate(e.getDate()+(parseInt(total)||16)*7);return e})();
  const sb={width:42,height:42,borderRadius:12,background:t.cardAlt,border:"none",display:"flex",alignItems:"center",justifyContent:"center"};
  const tw=parseInt(total)||0;
  return(
    <Modal onClose={onClose}>
      {pickIdx!==null&&<div style={{position:"absolute",inset:0,background:t.overlay,borderRadius:"28px 28px 0 0",zIndex:10,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setPickIdx(null)}>
        <div style={{background:t.bg,borderRadius:20,padding:20,width:300,boxShadow:"0 8px 32px rgba(0,0,0,.2)"}} onClick={e=>e.stopPropagation()}>
          <p style={{fontSize:14,fontWeight:700,color:t.text,marginBottom:12}}>Escolher cor</p>
          <ColorPicker color={phases[pickIdx]?.color||"#2563eb"} onChange={c=>updatePhase(pickIdx,"color",c)}/>
          <button onClick={()=>setPickIdx(null)} style={{...u.btnP,width:"100%",height:46,marginTop:12}}>OK</button>
        </div>
      </div>}
      <SheetHead title={section==="phases"?"Fases":"Início e duração"} onClose={onClose}/>
      {section==="dates"?<>
        <label style={u.lbl}>Data de início</label>
        <input type="date" value={startD} onChange={e=>setStartD(e.target.value)} style={{...u.inp,WebkitAppearance:"none"}}/>
        <label style={u.lbl}>Duração</label>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:t.card,borderRadius:16,padding:6,marginBottom:14,boxShadow:t.shadow}}>
          <button aria-label="Menos semanas" style={sb} onClick={()=>setTotal(Math.max(1,tw-1))}><I d={IC.minus} s={18} c={t.text} sw={2.4}/></button>
          <b style={{fontSize:18,color:t.text}}>{tw||"—"} <span style={{fontSize:12,color:t.textSec,fontWeight:600}}>semana{tw!==1?"s":""}</span></b>
          <button aria-label="Mais semanas" style={sb} onClick={()=>setTotal(Math.min(52,tw+1))}><I d={IC.plus} s={18} c={t.text} sw={2.4}/></button>
        </div>
        {end&&<p style={{fontSize:13,color:t.textSec,margin:"0 4px 18px"}}>Termina em {end.toLocaleDateString("pt-BR")}</p>}
      </>:<>
        {phases.map((ph,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button aria-label="Cor da fase" onClick={()=>setPickIdx(i)} style={{width:34,height:34,borderRadius:"50%",background:ph.color,border:`3px solid ${t.card}`,boxShadow:`0 0 0 1px ${t.border}`,flexShrink:0,padding:0}}/>
            <input value={ph.name} onChange={e=>updatePhase(i,"name",e.target.value)} style={{...u.inp,marginBottom:0,flex:1,padding:"12px 14px"}} placeholder="Nome da fase"/>
            <input type="number" aria-label="Semanas" min="1" max="20" value={ph.weeks??""} onChange={e=>{const v=e.target.value;updatePhase(i,"weeks",v===""?"":Math.max(1,parseInt(v)||1))}} onBlur={()=>{if(ph.weeks==="")updatePhase(i,"weeks",1)}} style={{width:58,padding:"12px 6px",borderRadius:14,border:`1.5px solid ${t.border}`,background:t.inputBg,color:t.text,fontWeight:700,textAlign:"center",outline:"none"}}/>
            <button aria-label="Remover fase" onClick={()=>removePhase(i)} style={{background:"none",border:"none",width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><I d={IC.close} s={16} c={t.textTer} sw={2.4}/></button>
          </div>
        ))}
        <div style={{fontSize:11,color:t.textTer,textAlign:"right",margin:"-4px 40px 10px 0"}}>Semanas</div>
        {phases.length>0&&totalPhaseWeeks!==(parseInt(total)||16)&&<p style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:t.red,margin:"0 4px 10px"}}><I d={IC.alert} s={14} c={t.red}/>As fases somam {totalPhaseWeeks} semanas, mas o plano tem {parseInt(total)||16}</p>}
        {phases.length===0&&<p style={{fontSize:13,color:t.textTer,margin:"0 4px 12px"}}>Sem fases — o progresso é linear.</p>}
        <button onClick={addPhase} style={{width:"100%",height:46,borderRadius:16,background:"transparent",border:`1.5px dashed ${t.border}`,color:t.accent,fontSize:14,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginBottom:16}}><I d={IC.plus} s={16} c={t.accent} sw={2.4}/>Adicionar fase</button>
      </>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10}}>
        <button onClick={onClose} style={u.btnG}>Cancelar</button>
        <button onClick={apply} style={u.btnP}>Salvar</button>
      </div>
    </Modal>
  );
}

// ── PROGRESS CHART (per exercise) ─────────────────────────────
// Load history of one exercise: done sessions where it was not skipped and had a weight
function ptsFor(state,wk,j){const w=state.w[wk];if(!w)return[];const pts=[];w.sessions.forEach((s,i)=>{const d=s.exercises?.[j];if(s.status==="done"&&d&&!d.skipped&&d.weight!=null)pts.push({si:i+1,w:d.weight,at:s.at})});return pts}
function doneCountFor(state,wk,j){return(state.w[wk]?.sessions||[]).filter(s=>s.status==="done"&&s.exercises?.[j]&&!s.exercises[j].skipped).length}
function LoadChart({pts}){
  const t=useT();const W=420,H=150,L=34,B=28,T=12;
  const ws=pts.map(p=>p.w);const mx=Math.max(...ws),mn=Math.min(...ws),rg=mx-mn||1;
  const x=i=>L+12+(i/Math.max(pts.length-1,1))*(W-L-28),y=v=>T+(1-(v-mn)/rg)*(H-T-B);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(" ");
  const ticks=[mx,(mx+mn)/2,mn].filter((v,i,a)=>a.indexOf(v)===i);
  const lab=pts.length>2?[0,Math.floor((pts.length-1)/2),pts.length-1]:pts.map((_,i)=>i);
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
    <defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={t.accent} stopOpacity=".22"/><stop offset="1" stopColor={t.accent} stopOpacity="0"/></linearGradient></defs>
    {ticks.map((v,i)=><g key={i}><line x1={L} y1={y(v)} x2={W} y2={y(v)} stroke={t.border}/><text x="0" y={y(v)+4} fontSize="11" fill={t.textTer}>{fmtKg(v)}</text></g>)}
    {lab.map(i=><text key={i} x={x(i)} y={H-6} fontSize="11" fill={t.textTer} textAnchor="middle">{pts[i].at?ddmm(pts[i].at):`S${pts[i].si}`}</text>)}
    <path d={`${line} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B}Z`} fill="url(#lcg)"/>
    <path d={line} fill="none" stroke={t.accent} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
    {pts.map((p,i)=><circle key={i} cx={x(i)} cy={y(p.w)} r={i===pts.length-1?6:4.5} fill={t.card} stroke={t.accent} strokeWidth="3"/>)}
  </svg>);
}
function LoadSummary({pts,doneN}){
  const t=useT();
  if(pts.length<2)return<div style={{textAlign:"center",padding:"26px 0",color:t.textTer,fontSize:13}}>{doneN>=2?"Sem carga registrada neste exercício":"Precisa de pelo menos 2 sessões concluídas para gerar o gráfico"}</div>;
  const first=pts[0].w,cur=pts[pts.length-1].w,delta=Math.round((cur-first)*10)/10,pct=first?Math.round(delta/first*1000)/10:0;
  return(<>
    <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:6,flexWrap:"wrap"}}>
      <b style={{fontSize:34,fontWeight:800,letterSpacing:-1,color:t.text}}>{fmtKg(cur)} kg</b>
      {delta!==0&&<span style={{display:"inline-flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:100,background:delta>0?t.accentBg:t.cardAlt,color:delta>0?t.accent:t.textSec,fontSize:12,fontWeight:700}}><I d={delta>0?IC.up:IC.down} s={12} c={delta>0?t.accent:t.textSec} sw={2.6}/>{fmtKg(Math.abs(delta))} kg · {delta>0?"+":""}{String(pct).replace(".",",")}%</span>}
      <span style={{fontSize:13,color:t.textSec}}>Em {pts.length} sessões</span>
    </div>
    <LoadChart pts={pts}/>
  </>);
}
function ProgressChart({wk,state,onClose}){
  const u=useUi(),t=u.t;const[sel,setSel]=useState(0);const td=state.td;const w=state.w[wk];
  if(!w||!td[wk])return null;
  const exs=td[wk].exercises;const ex=exs[sel];if(!ex)return null;
  return(
    <Modal onClose={onClose}>
      <SheetHead title="Evolução de carga" onClose={onClose}/>
      <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:6,marginBottom:14,WebkitOverflowScrolling:"touch"}}>
        {exs.map((e,i)=><button key={i} onClick={()=>setSel(i)} style={{...u.chip(i===sel),whiteSpace:"nowrap",flexShrink:0}}>{e.name}</button>)}
      </div>
      <LoadSummary pts={ptsFor(state,wk,sel)} doneN={doneCountFor(state,wk,sel)}/>
    </Modal>
  );

        {row(IC.hourglass,"Compensar faltas","O prazo se estende quando você falta",null,toggle)}
      </div>
      <div style={sec}>APARÊNCIA</div>
      <div style={grp}>{row(IC.contrast,"Tema",null,null,<Seg width={200} value={state.theme||"system"} onChange={v=>setState(p=>({...p,theme:v}))} opts={[["light","Claro"],["dark","Escuro"],["system","Sistema"]]}/>,{first:true})}</div>
      <div style={sec}>DADOS</div>
      <div style={grp}>
        {row(IC.download,"Exportar planilha",null,exportCSV,undefined,{first:true})}
        {row(IC.clipboard,"Importar treino de texto",null,()=>setShowPaste(true))}
        {row(IC.archive,"Backups",bk.length?`${bk.length} cópia${bk.length>1?"s":""} · última ${lastBk.toLocaleDateString("pt-BR")} ${lastBk.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}`:"Nenhum backup ainda",bk.length?()=>setShowBackups(true):null)}
      </div>
      <div style={sec}>ZONA DE RISCO</div>
      <div style={grp}>{row(IC.alert,"Resetar progresso","Apaga as sessões feitas (cria backup antes)",resetAll,null,{first:true,danger:true})}</div>
    </>);
  }

  if(view==="detail"&&hd){
    const{k,i}=hd;const s=state.w[k]?.sessions[i];const exs=td[k]?.exercises||[];if(!s)return null;
    return(
      <TC.Provider value={t}>
      <div style={{minHeight:"100dvh",maxWidth:480,margin:"0 auto",background:t.bg}}>
        <div style={{padding:"24px 20px 16px",display:"flex",alignItems:"center",gap:14}}>
          <button aria-label="Voltar" onClick={()=>setView("history")} style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:12,width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center"}}><I d={IC.back} s={18} c={t.text}/></button>
          <div><h1 style={{fontSize:18,fontWeight:700,color:t.text}}>Sessão {i+1}</h1><p style={{fontSize:12,color:t.textSec,margin:0}}>{k} · {s.at?new Date(s.at).toLocaleDateString("pt-BR"):""}</p></div>
        </div>
        {s.note&&<div style={{padding:"0 20px 12px"}}><div style={{background:t.yellowBg,border:`1px solid ${t.yellow}33`,borderRadius:12,padding:"10px 14px",fontSize:12,color:t.text}}>{s.note}</div></div>}
        <div style={{padding:"0 20px 40px",display:"flex",flexDirection:"column",gap:10}}>
          {exs.map((ex,j)=>{const d=s.exercises?.[j];
            return(<div key={j} style={{background:t.card,borderRadius:16,padding:14,border:`1px solid ${t.border}`,opacity:d?.skipped?.5:1}}>
              <div style={{fontSize:14,fontWeight:600,color:d?.skipped?t.textTer:t.text,textDecoration:d?.skipped?"line-through":"none"}}>{ex.name}</div>
              <div style={{fontSize:11,color:t.textSec,marginTop:3}}>{d?.skipped?"Pulado":((d?.weight!=null?`${d.weight} kg · `:"")+`${d?d.sets.filter(Boolean).length:0}/${ex.sets} séries`)}</div>
            </div>)})}
        </div>
      </div>
      </TC.Provider>
    );
  }

  if(view==="workout"&&active){
    const k=active;const w=state.w[k];if(!w)return null;
    const si=w.cur;const s=w.sessions[si];if(!s)return null;
    const exs=td[k]?.exercises||[];const p=ph(si);
    const ts=s.exercises.reduce((a,e)=>a+(e.skipped?0:(e.sets?.length||0)),0);const ds=s.exercises.reduce((a,e)=>a+(e.skipped?0:(e.sets?.filter(Boolean).length||0)),0);const pct=ts?Math.round(ds/ts*100):0;
    const focusIdx=focusEx;
    // next pending set after the one that started the rest (shown on the timer)
    const nextInfo=(()=>{if(timerOrigin==null)return null;const order=[timerOrigin,...exs.map((_,i)=>i).filter(i=>i>timerOrigin),...exs.map((_,i)=>i).filter(i=>i<timerOrigin)];
      for(const i of order){const d=s.exercises[i];if(!d||d.skipped)continue;const j=(d.sets||[]).findIndex(x=>!x);if(j>=0)return{name:exs[i].name,set:j+1,of:d.sets.length,weight:d.tag==="dropset"&&d.dropWeights?.[j]!=null?d.dropWeights[j]:d.weight}}return null})();
    const sq={width:42,height:42,borderRadius:14,background:t.card,border:"none",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:t.shadow,flexShrink:0};
    const menu=[[IC.edit,"Editar treino",()=>{setEditName(k);setEditDay(td[k]?.dayOfWeek||0);setShowEquip(false);setNewEquip("");setView("editWorkout")}],
      [IC.down,"Deload (reduzir cargas)",()=>setShowLoadModal("deload")],[IC.up,"Overload (aumentar cargas)",()=>setShowLoadModal("overload")],
      [IC.chart,"Evolução de carga",()=>setShowChart(k)],...(s._origWeights?[[IC.sync,"Restaurar pesos originais",()=>resetWeights(k)]]:[])];
    return(
      <TC.Provider value={t}>
      <div style={{minHeight:"100dvh",maxWidth:480,margin:"0 auto",background:t.bg,paddingBottom:"calc(96px + env(safe-area-inset-bottom))"}}>
        {toastEl}
        {showChart&&<ProgressChart wk={showChart} state={state} onClose={()=>setShowChart(null)}/>}
        {showLoadModal&&<LoadSlider isDeload={showLoadModal==="deload"} onApply={(pct)=>applyLoadAdjust(k,pct)} onClose={()=>setShowLoadModal(null)}/>}
        {showMenu&&<Modal onClose={()=>setShowMenu(false)}>
          <SheetHead title="Opções do treino" onClose={()=>setShowMenu(false)}/>
          <div style={{background:t.card,borderRadius:20,boxShadow:t.shadow,overflow:"hidden"}}>
            {menu.map(([ic,l,fn],i)=><button key={l} onClick={()=>{setShowMenu(false);fn()}} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"14px 16px",border:"none",borderTop:i?`1px solid ${t.border}`:"none",background:"none",textAlign:"left",fontSize:14,fontWeight:600,color:t.text}}>
              <span style={{width:34,height:34,borderRadius:11,background:t.accentBg,display:"flex",alignItems:"center",justifyContent:"center"}}><I d={ic} s={18} c={t.accent}/></span>{l}</button>)}
          </div>
        </Modal>}
        {timer&&<RestTimer key={timer.id} seconds={timer.sec} next={nextInfo} onClose={()=>{
          // only the timer on screen may close it (a stale one finishing later must not kill the new rest)
          if(timerRef.current?.id!==timer.id)return;timerRef.current=null;setTimer(null);
          // Focus back on the exercise that started the timer if it still has pending sets
          const originData=timerOrigin!=null?s.exercises[timerOrigin]:null;
          if(originData&&!originData.skipped&&originData.sets.some(x=>!x)){setFocusEx(timerOrigin)}
          else{const startFrom=timerOrigin!=null?timerOrigin+1:0;let nextInc=-1;
            for(let i=0;i<exs.length;i++){const ci=(startFrom+i)%exs.length;const d=s.exercises[ci];if(d&&!d.skipped&&d.sets.some(x=>!x)){nextInc=ci;break}}
            if(nextInc>=0)setFocusEx(nextInc)}
          setTimerOrigin(null);
        }}/>}
        <div>
          <div style={{padding:"18px 20px 12px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
              <button aria-label="Voltar" onClick={()=>{setTimer(null);setTimerOrigin(null);setFocusEx(null);setView("home")}} style={sq}><I d={IC.back} s={18} c={t.text} sw={2.4}/></button>
              <div style={{flex:1,minWidth:0}}>
                <h1 style={{fontSize:19,fontWeight:800,letterSpacing:-.3,color:t.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{k}</h1>
                <div style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:t.textSec,fontWeight:500,marginTop:2}}>{numPhases>0&&phases[p]&&<span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:100,background:t.accentBg,color:t.accent}}>{phases[p].name}</span>}Sessão {si+1} de {TOTAL}{td[k]?.dayLabel?` · ${td[k].dayLabel}`:""}</div>
              </div>
              <button aria-label="Opções do treino" onClick={()=>setShowMenu(true)} style={sq}><I d={IC.more} s={20} c={t.text} sw={3.4}/></button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{flex:1,height:8,borderRadius:4,background:t.border,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,borderRadius:4,background:"linear-gradient(90deg,#3b82f6,#2563eb)",transition:"width .3s"}}/></div>
              <span style={{fontSize:13,fontWeight:700,color:t.text}}>{ds}/{ts}<span style={{fontWeight:500,color:t.textSec}}> séries</span></span>
            </div>
            {s._origWeights&&<div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,fontSize:12,color:t.textSec}}><I d={s.deload?IC.down:IC.up} s={14} c={t.accent} sw={2.4}/>{s.deload?"Deload aplicado nesta sessão":"Overload aplicado nesta sessão"}<button onClick={()=>resetWeights(k)} style={{...u.link,marginLeft:"auto"}}>Restaurar</button></div>}
          </div>
          <div style={{padding:"0 20px 20px",display:"flex",flexDirection:"column",gap:10}}>
            {exs.length===0&&<div style={{background:t.card,borderRadius:22,padding:24,textAlign:"center",boxShadow:t.shadow}}>
              <div style={{width:48,height:48,borderRadius:16,background:t.accentBg,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"}}><I d={IC.dumbbell} s={24} c={t.accent}/></div>
              <b style={{display:"block",fontSize:16,color:t.text}}>Nenhum exercício neste treino</b>
              <p style={{fontSize:13,color:t.textSec,margin:"4px 0 14px"}}>Adicione exercícios ou importe de um texto.</p>
              <button onClick={()=>{setEditName(k);setEditDay(td[k]?.dayOfWeek||0);setShowEquip(false);setNewEquip("");setView("editWorkout")}} style={{border:"none",borderRadius:14,padding:"12px 18px",background:t.accent,color:"#fff",fontSize:14,fontWeight:700}}>Adicionar exercícios</button>
            </div>}
            {(()=>{
              // Super sets: exercises tagged with the same group letter are shown together, at the first member's position
              const ordered=[];const groups={};
              exs.forEach((ex,i)=>{
                const d=s.exercises[i]||{weight:null,sets:[]};
                if(d.tag==="superset"){const gk=d.ssGroup||SS_GROUPS[0];if(!groups[gk]){groups[gk]={type:"superset",group:gk,items:[]};ordered.push(groups[gk])}groups[gk].items.push({ex,data:d,idx:i})}
                else ordered.push({type:"single",ex,data:d,idx:i});
              });
              const card=(it,onRest)=><ExCard key={it.idx} ex={it.ex} data={it.data} onUpdate={d2=>upEx(k,si,it.idx,d2)} onRest={onRest||(sec=>startRest(it.idx,sec))} prog={getProgression(k,it.idx,state)} idx={it.idx} last={lastInfo(state,k,it.idx)} autoOpen={focusIdx===it.idx}/>;
              return ordered.map(g=>{
                if(g.type==="single")return card(g);
                if(g.items.length<2)return card(g.items[0]);
                const allGroupDone=g.items.every(it=>{const sets=it.data.sets||[];return sets.length>0&&sets.every(Boolean)});
                const lastDone=(()=>{const ls=g.items[g.items.length-1].data.sets||[];return ls.length>0&&ls.every(Boolean)})();
                return<div key={`sg${g.group}`} style={{borderRadius:26,padding:6,background:t.accentBg}}>
                  <div style={{fontSize:11,fontWeight:700,color:t.accent,padding:"4px 10px 8px",display:"flex",alignItems:"center",gap:6}}><I d={IC.zap} s={13} c={t.accent}/>Super set {g.group} · {g.items.length} exercícios{allGroupDone&&<I d={IC.check} s={13} c={t.accent} sw={2.8}/>}</div>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>
                    {/* rest only after the group's last exercise (or once it is finished) */}
                    {g.items.map((it,ii)=>card(it,sec=>{if(ii===g.items.length-1||lastDone)startRest(it.idx,sec)}))}
                  </div>
                </div>;
              });
            })()}
            <div style={{display:"flex",alignItems:"center",gap:10,background:t.card,borderRadius:18,padding:"4px 14px",boxShadow:t.shadow}}>
              <I d={IC.note} s={16} c={t.textTer}/>
              <input value={sessionNote} onChange={e=>setSessionNote(e.target.value)} placeholder="Anotação da sessão" style={{flex:1,padding:"12px 0",border:"none",background:"transparent",color:t.text,outline:"none"}}/>
            </div>
          </div>
        </div>
        <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,zIndex:40,background:t.bg,padding:"12px 20px",paddingBottom:"max(14px, env(safe-area-inset-bottom))",display:"grid",gridTemplateColumns:"1fr 2fr",gap:10,borderTop:`1px solid ${t.border}`}}>
          <button onClick={()=>complete(k,"skipped")} style={{height:54,border:"none",borderRadius:18,background:t.card,color:t.textSec,fontSize:15,fontWeight:700,boxShadow:t.shadow,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><I d={IC.skip} s={14} c={t.textSec}/>Pular</button>
          <button onClick={()=>{if(ds===0){if(!confirm("Nenhuma série feita. Concluir mesmo assim?"))return}complete(k,"done")}} style={{height:54,border:"none",borderRadius:18,background:"linear-gradient(135deg,#3b82f6,#2563eb)",color:"#fff",fontSize:15,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",gap:8,boxShadow:"0 8px 20px rgba(37,99,235,.35)"}}><I d={IC.check} s={18} c="#fff" sw={2.6}/>Concluir treino</button>
        </div>
      </div>
      </TC.Provider>
    );
  }
  return null;
}

function LoginScreen(){
  const dark=window.matchMedia?.("(prefers-color-scheme:dark)").matches||false;
  const t=dark?themes.dark:themes.light;
  const[loading,setLoading]=useState(false);
  const[email,setEmail]=useState("");
  const[sent,setSent]=useState(false);
  const[err,setErr]=useState("");
  const[showEmail,setShowEmail]=useState(false);
  useEffect(()=>{document.body.style.background=t.bg;document.body.style.color=t.text},[]);
  const loginGoogle=async()=>{
    setLoading(true);setErr("");
    const{error}=await supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:window.location.href}});
    if(error){setErr(error.message);setLoading(false);}
  };
  const loginEmail=async()=>{
    if(!email.trim())return;
    setLoading(true);setErr("");
    const{error}=await supabase.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:window.location.href}});
    setLoading(false);
    if(error)setErr(error.message);else setSent(true);
  };
  return(
    <div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:t.bg,padding:"0 24px"}}>
      <div style={{width:"100%",maxWidth:360,textAlign:"center"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:18}}><Logo s={76}/></div><h1 style={{fontSize:40,fontWeight:800,letterSpacing:-1,color:t.text,marginBottom:6}}><span style={{color:t.accent}}>Rep</span>Forge</h1>
        <p style={{fontSize:14,color:t.textSec,marginBottom:48}}>Tracking de treino</p>
        {sent?(
          <div style={{background:t.accentBg,borderRadius:20,padding:24}}>
            <div style={{fontSize:16,fontWeight:600,color:t.accent,marginBottom:8}}>Link enviado!</div>
            <div style={{fontSize:13,color:t.textSec}}>Verifique seu email <b style={{color:t.text}}>{email}</b> e clique no link para entrar.</div>
          </div>
        ):(
          <>
            <button onClick={loginGoogle} disabled={loading} style={{width:"100%",padding:"14px 20px",borderRadius:16,background:t.card,border:`1px solid ${t.border}`,color:t.text,fontSize:15,fontWeight:600,display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:12,cursor:"pointer",opacity:loading?.7:1}}>
              <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
              Entrar com Google
            </button>
            {!showEmail?(
              <button onClick={()=>setShowEmail(true)} style={{width:"100%",padding:"14px 20px",borderRadius:16,background:"transparent",border:`1px solid ${t.border}`,color:t.textSec,fontSize:14,fontWeight:500,cursor:"pointer"}}>Entrar com email</button>
            ):(
              <div>
                <input type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&loginEmail()} placeholder="seu@email.com" autoFocus style={{width:"100%",padding:"14px 16px",borderRadius:14,border:`1px solid ${t.border}`,background:t.inputBg,color:t.text,fontSize:15,outline:"none",marginBottom:10,boxSizing:"border-box"}}/>
                <button onClick={loginEmail} disabled={loading||!email.trim()} style={{width:"100%",padding:"14px 20px",borderRadius:14,background:t.accent,border:"none",color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer",opacity:(loading||!email.trim())?.7:1}}>
                  {loading?"Enviando...":"Enviar link"}
                </button>
              </div>
            )}
            {err&&<div style={{marginTop:12,fontSize:12,color:t.red,textAlign:"center"}}>{err}</div>}
          </>
        )}
      </div>
    </div>
  );
}

function Root(){
  const[session,setSession]=useState(undefined);
  useEffect(()=>{
    if(!supabase)return;
    // Subscribe FIRST — catches SIGNED_IN emitted during URL token exchange,
    // and INITIAL_SESSION emitted by newer supabase-js clients after init
    let resolved=false;
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,sess)=>{
      resolved=true;
      setSession(sess);
    });
    // Fallback: in case onAuthStateChange doesn't emit INITIAL_SESSION
    // (older supabase-js); only applies if the listener hasn't fired yet
    supabase.auth.getSession().then(({data:{session}})=>{
      if(!resolved)setSession(session??null);
    });
    return()=>subscription.unsubscribe();
  },[]);
  if(!supabase)return<div style={{minHeight:"100dvh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center",fontFamily:"system-ui"}}>Não foi possível carregar o RepForge (sem conexão na primeira abertura?). Recarregue a página.</div>;
  if(session===undefined){
    const dark=window.matchMedia?.("(prefers-color-scheme:dark)").matches||false;
    const t=dark?themes.dark:themes.light;
    return<div style={{minHeight:"100dvh",background:t.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:14}}><Logo s={72}/><h1 style={{fontSize:28,fontWeight:800,letterSpacing:-.8,color:t.text}}><span style={{color:t.accent}}>Rep</span>Forge</h1></div></div>;
  }
  if(!session)return<LoginScreen/>;
  return<App key={session.user.id} session={session}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
